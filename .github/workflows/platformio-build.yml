name: ESP32-S3 Synth Studio CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-esp32-firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache PlatformIO & Pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
        key: ${{ runner.os }}-pio-synth-studio-${{ hashFiles('platformio.ini') }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build & Stage Target 1 (Waveshare 7-inch 800x480)
      run: |
        pio run -e waveshare_7inch_800x480
        mkdir -p dist/waveshare_7inch_800x480
        cp .pio/build/waveshare_7inch_800x480/firmware.bin dist/waveshare_7inch_800x480/firmware.bin
        cp .pio/build/waveshare_7inch_800x480/partitions.bin dist/waveshare_7inch_800x480/partitions.bin
        cp .pio/build/waveshare_7inch_800x480/bootloader.bin dist/waveshare_7inch_800x480/bootloader.bin
        ls -lh dist/waveshare_7inch_800x480/

    - name: Build & Stage Target 2 (DevKit 2.8-inch SPI 320x240)
      run: |
        pio run -e devkit_spi_28inch_320x240
        mkdir -p dist/devkit_spi_28inch_320x240
        cp .pio/build/devkit_spi_28inch_320x28inch_320x240/firmware.bin dist/devkit_spi_28inch_320x240/firmware.bin 2>/dev/null || cp .pio/build/devkit_spi_28inch_320x240/firmware.bin dist/devkit_spi_28inch_320x240/firmware.bin
        cp .pio/build/devkit_spi_28inch_320x240/partitions.bin dist/devkit_spi_28inch_320x240/partitions.bin
        cp .pio/build/devkit_spi_28inch_320x240/bootloader.bin dist/devkit_spi_28inch_320x240/bootloader.bin
        ls -lh dist/devkit_spi_28inch_320x240/

    - name: Build & Stage Target 3 (DevKit 2.4-inch ILI9341 + PCM5102)
      run: |
        pio run -e devkit_spi_24inch_ili9341_pcm5102
        mkdir -p dist/devkit_spi_24inch_ili9341_pcm5102
        cp .pio/build/devkit_spi_24inch_ili9341_pcm5102/firmware.bin dist/devkit_spi_24inch_ili9341_pcm5102/firmware.bin
        cp .pio/build/devkit_spi_24inch_ili9341_pcm5102/partitions.bin dist/devkit_spi_24inch_ili9341_pcm5102/partitions.bin
        cp .pio/build/devkit_spi_24inch_ili9341_pcm5102/bootloader.bin dist/devkit_spi_24inch_ili9341_pcm5102/bootloader.bin
        ls -lh dist/devkit_spi_24inch_ili9341_pcm5102/

    - name: Upload Compiled Synth Studio Firmware Artifact (All 3 Targets)
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-synth-studio-firmwares
        path: dist/
        retention-days: 7
